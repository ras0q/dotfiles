[bootstrap.packages]
"brew:awk" = { version = "latest", os = "macos" }
"brew:cmake" = { version = "latest", os = "macos" }
"brew:ffmpeg" = { version = "latest", os = "macos" }
"brew:fish" = { version = "latest", os = "macos" }
"brew:htop" = { version = "latest", os = "macos" }
"brew:ttyd" = { version = "latest", os = "macos" }
"brew:wget" = { version = "latest", os = "macos" }
"brew-cask:1password" = { version = "latest", os = "macos" }
"brew-cask:nikitabobko/tap/aerospace" = { version = "latest", os = "macos" }
"brew-cask:discord" = { version = "latest", os = "macos" }
"brew-cask:dominion525/tap/cmd-eikana" = { version = "latest", os = "macos" }
"brew-cask:font-source-code-pro" = { version = "latest", os = "macos" }
"brew-cask:google-chrome" = { version = "latest", os = "macos" }
"brew-cask:keycastr" = { version = "latest", os = "macos" }
"brew-cask:macskk" = { version = "latest", os = "macos" }
"brew-cask:meetingbar" = { version = "latest", os = "macos" }
"brew-cask:obsidian" = { version = "latest", os = "macos" }
"brew-cask:slack" = { version = "latest", os = "macos" }
"brew-cask:wezterm@nightly" = { version = "latest", os = "macos" }
"brew-cask:xcodes-app" = { version = "latest", os = "macos" }

[bootstrap.macos.dock]
autohide = true
show_recents = false
mru_spaces = false

[bootstrap.macos.keyboard]
automatic_capitalization = false
automatic_spelling_correction = false
fn_state = true

[bootstrap.macos.login_items]
apps = [
  "/Applications/1Password.app",
  "/Applications/MeetingBar.app",
  "/Applications/KeyCastr.app",
  "/Applications/⌘英かな.app/",
]

[bootstrap.macos.defaults.NSGlobalDomain]
NSAutomaticInlinePredictionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
"com.apple.swipescrolldirection" = false

[bootstrap.macos.defaults."com.apple.dock"]
"expose-group-apps" = true
"wvous-bl-corner" = 14  # Quick Note
"wvous-bl-modifier" = 0
"wvous-br-corner" = 2  # Mission Control
"wvous-br-modifier" = 0

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableStandardClickToShowDesktop = false
StandardHideDesktopIcons = true

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowSeconds = true

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.keyboard.modifiermapping.0-0-0"
host = "current"
value = [
  # Caps Lock → right Control
  { HIDKeyboardModifierMappingSrc = 30064771129, HIDKeyboardModifierMappingDst = 30064771300 },
]

[dotfiles]
"~/.config/aerospace" = "mac/aerospace"
"~/.config/wezterm" = "common/wezterm"
"~/.local/bin/op-ssh-sign" = "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"
