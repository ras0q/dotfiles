[[env]]
_.file = "{{ cwd }}/.env"

[[env]]
_.file = "{{ cwd }}/.envrc"

# FIXME: https://github.com/evilmartians/lefthook/issues/1489
[[hooks.cd]]
shell = "fish"
script = '''
set --local repo_root (git rev-parse --show-toplevel 2>/dev/null)
if test -n "$repo_root"; and not test -f "$repo_root/lefthook.yml"; and test -f "$repo_root/lefthook-local.yml"
  set --global --export LEFTHOOK_CONFIG "$repo_root/lefthook-local.yml"
else
  set --erase LEFTHOOK_CONFIG
end
'''

